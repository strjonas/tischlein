[project]
name = "tischlein"
version = "0.1.0"
description = "Tischlein: an assistive fetching robot (CAD, calculations, MuJoCo simulation and benchmark)"
authors = [
    { name = "Jonas Strabel" }
]
requires-python = ">=3.13"
dependencies = [
    "build123d>=0.13.0",
    "imageio>=2.38.1",
    "matplotlib>=3.11.2",
    "mujoco>=3.17.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "trimesh>=5.2.0",
]

[tool.uv]
package = false
